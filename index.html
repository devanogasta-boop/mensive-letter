
<!DOCTYPE html>
<html>

<head>
    <title>Mensive Letter</title>

    <style>
        body {
            background: #ffe4ec;
            font-family: Arial, sans-serif;
            text-align: center;
            color: #b85c7a;
        }

        h1 {
            color: #d96f94;
            font-size: 40px;
        }

        .card {
            background: #fff8f5;
            width: 80%;
            max-width: 400px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 30px;
            border: 4px solid white;
            box-shadow: 0 8px 20px #e8a8bd;
        }

        h2 {
            color: #d96f94;
        }

        button {
            background: #e99ab5;
            color: white;
            border: 3px solid white;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>

</head>

<body>

    <h1>Catch the Love Letters! ♡</h1>

    <p>Help Teddy collect all the love letters!</p>

    <div class="card">

        <h2>Oh no! 💌</h2>

        <p>The love letters are falling everywhere!</p>

        <p>Help Teddy catch them!</p>

        <button>START GAME ♡</button>

    </div>

</body>

</html>
